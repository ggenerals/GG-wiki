site_name: GenGen wiki
site_author: GGenerals
site_url: https://gengen.qzz.io/wiki/

theme:
  name: material
  features:
    # --- 代码块增强 ---
    - content.code.copy          # 为代码块启用复制按钮[reference:2]
    - content.code.annotate      # 为代码块启用注解功能（可选）

    # --- 内容选项卡增强 ---
    - content.tabs.link          # 允许内容选项卡的链接联动[reference:3]

  palette:
    # 亮色模式
    - scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式

    # 暗色模式
    - scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式

  features:
    - navigation.tabs
    - content.tabs.link

  language: zh

extra_css:
  - css/theme.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - macros

markdown_extensions:
  - admonition

  - pymdownx.details

  - pymdownx.superfences

  - pymdownx.arithmatex:
      generic: true

  # --- 基础扩展（折叠框依赖）---
  - admonition                   # 启用提示框（Admonition）语法[reference:4]
  - pymdownx.details             # 启用可折叠块（Details）语法[reference:5]

  # --- 高级代码块（推荐）---
  - pymdownx.highlight:
      anchor_linenums: true      # 为行号添加锚点，方便链接[reference:6]
  - pymdownx.superfences         # 支持在代码块中嵌套其他内容，是内容选项卡的基础[reference:7]

  # --- 内容选项卡（推荐）---
  - pymdownx.tabbed:
      alternate_style: true      # 使用更现代的选项卡样式[reference:8]

  # --- 其他实用扩展（可选）---
  - attr_list                    # 允许为元素添加HTML属性和CSS类[reference:9]
  - md_in_html                   # 允许在HTML块中使用Markdown语法[reference:10]
  - tables                       # 启用表格语法[reference:11]
  - toc:
      permalink: true            # 为标题添加永久链接图标[reference:12]
      toc_depth: 3               # 设置目录深度为3级[reference:13]
  

nav:
  - 首页: index.md

  - 数据结构:
      - 线段树:
          - 线段树基础: data_structure/线段树/Segment_basic.md
      - 分块:
          - 倍增值域分块: data_structure/分块/倍增值域分块.md

  - 数学:
      - 数学基础:
          - 集合与逻辑: math/数学基础/set_logic.md
          - 函数入门: math/数学基础/function.md
          - 复数: math/数学基础/complex.md
          - 向量入门: math/数学基础/vector.md

      - 数论:
          - 数论基础: math/数论/mod-prime.md
          - 中国剩余定理: math/数论/crt.md
          - 最大公因数: math/数论/gcd.md

      - 生成函数:
          - 普通型生成函数: math/生成函数/ogf.md
          - 指数型生成函数: math/生成函数/egf.md

  - 字符串:
      - 字典树: string/Trie.md