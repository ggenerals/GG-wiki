site_name: GenGen wiki
site_author: GGenerals
site_url: https://gengen.qzz.io/wiki/ 


theme:
  name: material
  palette:
    # 亮色模式
    - scheme: default
      primary: white        # 亮色模式下保持蓝色
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    # 暗色模式
    - scheme: slate
      primary: black          # 👈 暗色模式顶栏改为深灰色
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式
  features:
    - navigation.tabs
  language: zh      # 关键：设置为中文

extra_css:
  - css/theme.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - git-authors

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      linenums: true
      line_spans: __span
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details

nav:
  - 首页: index.md
  - 数学:
    - 数学基础: 
      - 集合与逻辑: math/数学基础/set_logic.md
      - 函数入门: math/数学基础/function.md
      - 复数: math/数学基础/complex.md
      - 向量入门: math/数学基础/vector.md
    - 数论: 
      - 数论基础: math/数论/mod-prime.md
      - 中国剩余定理: math/数论/crt.md
      - 最大公因数: math/数论/gcd.md
    - 生成函数:
      - 普通型生成函数: math/生成函数/ogf.md
      - 指数型生成函数: math/生成函数/egf.md
  - 字符串: 
    - 字典树: string/Trie.md
